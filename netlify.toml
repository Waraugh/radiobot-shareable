[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/now-playing"
  to = "/.netlify/functions/nowplaying"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/api/artwork"
  to = "/.netlify/functions/artwork"
  status = 200
