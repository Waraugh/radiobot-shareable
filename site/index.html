<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rican Radio">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png">
<title>Rican Radio</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0b;color:#fff;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:#171717;border:1px solid #303030;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0008}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#aaa;font-weight:700}
.station{font-size:2.15rem;line-height:1.05;font-weight:900;margin:8px 0 6px}.source{font-size:.9rem;color:#888;font-weight:650;margin-bottom:28px}
.now{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:#888;font-weight:800}
.track{display:flex;gap:18px;align-items:center;min-height:112px;margin:10px 0 22px}.art{width:108px;height:108px;flex:0 0 108px;border-radius:14px;object-fit:cover;box-shadow:0 8px 24px #0007;display:none}
.tracktext{min-width:0}.song{font-size:1.4rem;line-height:1.14;font-weight:800;overflow-wrap:anywhere}.artist{font-size:1rem;line-height:1.3;color:#aaa;font-weight:650;margin-top:7px;overflow-wrap:anywhere}.loading{font-size:1.25rem;font-weight:750}
.play{width:100%;border:0;border-radius:16px;padding:17px;font-size:1.1rem;font-weight:850;background:#fff;color:#111;cursor:pointer}.play:active{transform:scale(.99)}
.status{margin-top:14px;color:#8e8e8e;font-size:.86rem;text-align:center}.install{margin-top:22px;border-top:1px solid #292929;padding-top:18px;color:#aaa;font-size:.88rem;line-height:1.45}.install b{color:#ddd}
@media(max-width:390px){.card{padding:25px}.track{gap:14px}.art{width:94px;height:94px;flex-basis:94px}.song{font-size:1.25rem}}
</style></head><body>
<main class="card"><div class="eyebrow">Live Stream</div><div class="station">RICAN RADIO</div><div class="source">RADIO BOB! · 2000er Rock</div>
<div class="now">Now Playing</div><div class="track"><img class="art" id="art" alt=""><div class="tracktext"><div class="loading" id="loading">Loading song information…</div><div class="song" id="song"></div><div class="artist" id="artist"></div></div></div>
<button class="play" id="play">▶ Play</button><div class="status" id="status">Ready</div><div class="install"><b>iPhone:</b> Share → Add to Home Screen<br><b>Android:</b> Menu (⋮) → Add to Home screen<br>Install Rican Radio like an app.</div></main>
<audio id="audio" preload="none" src="https://streams.radiobob.de/2000er/mp3-192/streams.radiobob.de/"></audio>
<script>
const audio=document.getElementById('audio'),play=document.getElementById('play'),status=document.getElementById('status'),song=document.getElementById('song'),artist=document.getElementById('artist'),art=document.getElementById('art'),loading=document.getElementById('loading');
let playing=false;play.addEventListener('click',async()=>{try{if(!playing){await audio.play();playing=true;play.textContent='❚❚ Pause';status.textContent='Playing live';}else{audio.pause();playing=false;play.textContent='▶ Play';status.textContent='Paused';}}catch(e){status.textContent='Could not start audio — tap Play again';}});
audio.addEventListener('playing',()=>{playing=true;play.textContent='❚❚ Pause';status.textContent='Playing live'});audio.addEventListener('pause',()=>{playing=false;play.textContent='▶ Play';if(audio.currentTime)status.textContent='Paused'});audio.addEventListener('error',()=>status.textContent='Stream connection error — try Play again');
const TITLE_DELAY_MS=35000;let displayedTitle='',pendingTitle='',pendingSince=0,artworkRequest=0;
function splitTitle(raw){const i=raw.indexOf(' - ');if(i<1)return{artist:'',song:raw};return{artist:raw.slice(0,i).trim(),song:raw.slice(i+3).trim()};}
async function updateArtwork(a,s){const request=++artworkRequest;art.style.display='none';art.removeAttribute('src');if(!a||!s)return;try{const r=await fetch('/api/artwork?artist='+encodeURIComponent(a)+'&track='+encodeURIComponent(s));if(!r.ok)return;const d=await r.json();if(request!==artworkRequest||!d.artwork)return;art.onload=()=>{if(request===artworkRequest)art.style.display='block'};art.onerror=()=>{art.style.display='none';art.removeAttribute('src')};art.src=d.artwork;}catch(e){}}
function showTitle(raw){displayedTitle=raw;const p=splitTitle(raw);loading.style.display='none';song.textContent=p.song;artist.textContent=p.artist;artist.style.display=p.artist?'block':'none';document.title=(p.song||raw)+' — Rican Radio';updateArtwork(p.artist,p.song);}
async function updateTitle(){try{const r=await fetch('/api/now-playing');const d=await r.json();if(r.ok&&d.title){const incoming=d.title.trim();if(!displayedTitle){showTitle(incoming);}else if(incoming===displayedTitle){pendingTitle='';pendingSince=0;}else{if(incoming!==pendingTitle){pendingTitle=incoming;pendingSince=Date.now();}if(Date.now()-pendingSince>=TITLE_DELAY_MS){showTitle(pendingTitle);pendingTitle='';pendingSince=0;}}}}catch(e){}}
updateTitle();setInterval(updateTitle,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTitle()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
