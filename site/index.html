<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rican Radio">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png?v=5">
<link rel="icon" type="image/png" href="/icon-192.png?v=5">
<title>Rican Radio</title>

<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0b0b;color:#fff;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:#171717;border:1px solid #303030;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0008}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#aaa;font-weight:700}
.station{font-size:2.15rem;line-height:1.05;font-weight:900;margin:8px 0 6px}
.source{font-size:.9rem;color:#888;font-weight:650;margin-bottom:14px}
.stations{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 18px}
.stationbtn{flex:0 0 auto;border:1px solid #353535;border-radius:999px;padding:8px 12px;background:#202020;color:#aaa;font-size:.78rem;font-weight:750;cursor:pointer;white-space:nowrap}
.stationbtn.active{background:#48e0d3;color:#092427;border-color:#48e0d3}
.stationbtn:active{transform:scale(.97)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:#888;font-weight:800}
.track{display:flex;gap:18px;align-items:center;min-height:112px;margin:10px 0 22px}
.art{width:108px;height:108px;flex:0 0 108px;border-radius:14px;object-fit:cover;box-shadow:0 8px 24px #0007;display:none}
.tracktext{min-width:0}
.song{font-size:1.4rem;line-height:1.14;font-weight:800;overflow-wrap:anywhere}
.artist{font-size:1rem;line-height:1.3;color:#aaa;font-weight:650;margin-top:7px;overflow-wrap:anywhere}
.loading{font-size:1.25rem;font-weight:750}

.upnext{display:none;border-top:1px solid #292929;padding-top:18px;margin:0 0 22px}
.uptrack{display:flex;gap:12px;align-items:center;margin-top:10px}
.upart{width:56px;height:56px;flex:0 0 56px;border-radius:9px;object-fit:cover;display:none}
.upsong{font-size:1rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.upartist{font-size:.88rem;color:#999;font-weight:650;margin-top:4px;overflow-wrap:anywhere}

.play{width:100%;border:0;border-radius:16px;padding:17px;font-size:1.1rem;font-weight:850;background:#48e0d3;color:#092427;cursor:pointer}
.play:active{transform:scale(.99)}
.status{margin-top:14px;color:#8e8e8e;font-size:.86rem;text-align:center}
.syncnote{margin-top:6px;color:#666;font-size:.76rem;text-align:center}
.install{margin-top:22px;border-top:1px solid #292929;padding-top:18px;color:#aaa;font-size:.88rem;line-height:1.45}
.install b{color:#ddd}

@media(max-width:390px){
.card{padding:25px}
.track{gap:14px}
.art{width:94px;height:94px;flex-basis:94px}
.song{font-size:1.25rem}
}
</style>

<script>
const STATIONS={

    },

    'hiphop':{label:'Hip-Hop / R&B',source:"Today's Hottest Hip Hop",stream:'https://streaming.live365.com/a99954',provider:'live365'},
    'country':{label:'Country',source:"Today's Hottest Country",stream:'https://streaming.live365.com/a13336',provider:'live365'},
    'fm00shiphop':{label:'1.FM 00s Hip-Hop',source:'1.FM 00s Hip-Hop',stream:'https://strm112.1.fm/00shiphop_mobile_mp3',provider:'external'},
    '90s90s_bawue':{label:'90s90s BAWÜ',source:'90s90s BAWÜ',stream:'https://streams.90s90s.de/bawue/mp3-192/streams.90s90s.de/',provider:'external'},
    '90s90s_rnb':{label:'90s90s RnB',source:'90s90s RnB',stream:'https://streams.90s90s.de/rnb/mp3-192/streams.90s90s.de/',provider:'external'},
    '90s90s_90s00s':{label:'90s90s 90s00s',source:'90s90s 90s00s',stream:'https://streams.90s90s.de/90s00s/mp3-192/streams.90s90s.de/',provider:'external'},
    '90s90s_hessen':{label:'90s90s HESSEN',source:'90s90s HESSEN',stream:'https://streams.90s90s.de/hessen/mp3-192/streams.90s90s.de/',provider:'external'},
    '90s90s_house':{label:'90s90s House',source:'90s90s House',stream:'https://streams.90s90s.de/house/mp3-192/streams.90s90s.de/',provider:'external'},
    '90s90s_lovesongs':{label:'90s90s Lovesongs',source:'90s90s Lovesongs',stream:'https://streams.90s90s.de/love/mp3-192/streams.90s90s.de/',provider:'external'},
    '90s90s_nrw':{label:'90s90s NRW',source:'90s90s NRW',stream:'https://streams.90s90s.de/nrw/mp3-192/streams.90s90s.de/',provider:'external'},
    '90s90s_techno':{label:'90s90s Techno',source:'90s90s Techno',stream:'https://streams.90s90s.de/techno/mp3-192/streams.90s90s.de/',provider:'external'},
    '90s90s_boygroup':{label:'90s90s Boygroup',source:'90s90s Boygroup',stream:'https://streams.90s90s.de/boygroup/mp3-192/streams.90s90s.de/',provider:'external'}
};

/*
 * Measured channel-metadata lead over audible playback:
 * approximately 35–41 seconds across observed transitions.
 */
const AUDIO_DELAY_MS=38000;

const audio=document.getElementById('audio');
const play=document.getElementById('play');
const status=document.getElementById('status');
const syncnote=document.getElementById('syncnote');
const source=document.getElementById('source');
const stationButtons=[...document.querySelectorAll('.stationbtn')];

const song=document.getElementById('song');
const artist=document.getElementById('artist');
const art=document.getElementById('art');
const loading=document.getElementById('loading');

const upnext=document.getElementById('upnext');
const upsong=document.getElementById('upsong');
const upartist=document.getElementById('upartist');
const upart=document.getElementById('upart');

let playing=false;
let current=null;
let pending=null;
let promotionTimer=null;
let socket=null;
let reconnectTimer=null;
let live365Timer=null;
let stationGeneration=0;

let stationId=localStorage.getItem('ricanRadioStation');
if(!STATIONS[stationId])stationId='2000s';

play.addEventListener('click',async()=>{
    try{
        if(!playing){
            await audio.play();
            playing=true;
            play.textContent='❚❚ Pause';
            status.textContent='Playing live';
        }else{
            audio.pause();
            playing=false;
            play.textContent='▶ Play';
            status.textContent='Paused';
        }
    }catch(e){
        status.textContent='Could not start audio — tap Play again';
    }
});

audio.addEventListener('playing',()=>{
    playing=true;
    play.textContent='❚❚ Pause';
    status.textContent='Playing live';
});

audio.addEventListener('pause',()=>{
    playing=false;
    play.textContent='▶ Play';
    if(audio.currentTime)status.textContent='Paused';
});

audio.addEventListener('error',()=>{
    status.textContent='Stream connection error — try Play again';
});

function artworkURL(track){
    if(!track)return '';

    if(track.images&&track.images.large&&track.images.large.url)
        return track.images.large.url;

    if(track.cover)
        return track.cover;

    return '';
}

function setImage(element,url){
    element.style.display='none';
    element.removeAttribute('src');

    if(!url)return;

    element.onload=()=>element.style.display='block';
    element.onerror=()=>{
        element.style.display='none';
        element.removeAttribute('src');
    };

    element.src=url;
}

function showCurrent(track){
    if(!track)return;

    current=track;

    loading.style.display='none';
    song.textContent=track.song||'';
    artist.textContent=track.artist||'';
    artist.style.display=track.artist?'block':'none';

    setImage(art,artworkURL(track));

    document.title=(track.song||'Rican Radio')+' — Rican Radio';

    if('mediaSession' in navigator){
        try{
            const artwork=artworkURL(track);

            navigator.mediaSession.metadata=new MediaMetadata({
                title:track.song||'Rican Radio',
                artist:track.artist||'',
                album:STATIONS[stationId].source,
                artwork:artwork?[{
                    src:artwork,
                    sizes:'1200x1200',
                    type:'image/jpeg'
                }]:[]
            });
        }catch(e){}
    }
}

function showPending(track){
    pending=track;

    upsong.textContent=track.song||'';
    upartist.textContent=track.artist||'';
    upartist.style.display=track.artist?'block':'none';

    setImage(upart,artworkURL(track));

    upnext.style.display='block';
}

function hidePending(){
    upnext.style.display='none';
    upsong.textContent='';
    upartist.textContent='';
    upart.style.display='none';
    upart.removeAttribute('src');
}

function sameTrack(a,b){
    if(!a||!b)return false;

    if(a.id&&b.id)
        return a.id===b.id;

    return a.artist===b.artist&&a.song===b.song;
}

function scheduleTrack(track){
    if(!track||track.type!=='now'||!track.song)return;

    if(current&&sameTrack(track,current))
        return;

    if(pending&&sameTrack(track,pending))
        return;

    /*
     * On initial load we need something to display immediately.
     * Subsequent channel events are early relative to audible audio,
     * so they become Up Next until the measured audio delay expires.
     */
    if(!current){
        showCurrent(track);
        return;
    }

    showPending(track);

    if(promotionTimer)
        clearTimeout(promotionTimer);

    promotionTimer=setTimeout(()=>{
        if(!pending)return;

        const next=pending;
        pending=null;

        showCurrent(next);
        hidePending();
        syncnote.style.display='none';
    },AUDIO_DELAY_MS);
}

async function loadInitialMetadata(generation=stationGeneration){
    const station=STATIONS[stationId];
    if(!station.channel)return;

    try{
        const response=await fetch(
            'https://api.streamabc.net/metadata/channel/'+station.channel+'.json',
            {cache:'no-store'}
        );

        if(!response.ok||generation!==stationGeneration)
            return;

        const data=await response.json();

        if(generation===stationGeneration)
            scheduleTrack(data);
    }catch(e){}
}

function connectMetadata(generation=stationGeneration){
    const station=STATIONS[stationId];
    if(!station.channel)return;

    if(socket&&(socket.readyState===WebSocket.OPEN||
                socket.readyState===WebSocket.CONNECTING))
        return;

    try{
        const ws=new WebSocket(
            'wss://api.streamabc.net/metadata/channel/'+station.channel
        );

        socket=ws;

        ws.onmessage=event=>{
            if(generation!==stationGeneration)return;

            try{
                const data=JSON.parse(event.data);
                scheduleTrack(data);
            }catch(e){}
        };

        ws.onclose=()=>{
            if(socket===ws)socket=null;
            if(generation!==stationGeneration)return;

            clearTimeout(reconnectTimer);
            reconnectTimer=setTimeout(
                ()=>connectMetadata(generation),
                5000
            );
        };

        ws.onerror=()=>{
            try{ws.close();}catch(e){}
        };
    }catch(e){
        if(generation!==stationGeneration)return;

        clearTimeout(reconnectTimer);
        reconnectTimer=setTimeout(
            ()=>connectMetadata(generation),
            5000
        );
    }
}

// Live365 reports the track currently on air; it does not provide Up Next.
const live365ArtworkCache=new Map();

function normalizedMusicText(value){
    return (value||'').toLowerCase().normalize('NFKD')
        .replace(/[\u0300-\u036f]/g,'')
        .replace(/\b(feat(?:uring)?|ft)\.?\b.*$/i,'')
        .replace(/\([^)]*\b(remix|edit|version|radio|clean|explicit|remaster)\b[^)]*\)/gi,'')
        .replace(/[^a-z0-9]+/g,' ').trim();
}

function musicTitleMatches(wanted,candidate){
    const a=normalizedMusicText(wanted),b=normalizedMusicText(candidate);
    if(!a||!b)return false;
    if(a===b)return true;
    // Allow a version suffix, but not a different song with a shared prefix.
    return (b.startsWith(a+' ')&&/^(live|remaster|radio edit|single version|album version|clean|explicit)\b/.test(b.slice(a.length+1)))||
           (a.startsWith(b+' ')&&/^(live|remaster|radio edit|single version|album version|clean|explicit)\b/.test(a.slice(b.length+1)));
}

function musicArtistMatches(wanted,candidate){
    const a=normalizedMusicText(wanted),b=normalizedMusicText(candidate);
    if(!a||!b)return false;
    if(a===b)return true;
    const parts=value=>value.split(/\s*(?:,|&|\+|\/|\bx\b|\band\b|\bwith\b)\s*/i)
        .map(normalizedMusicText).filter(Boolean);
    const artists=parts(wanted),catalog=parts(candidate);
    if(artists.some(name=>catalog.includes(name)))return true;
    // A station may credit collaborators while the catalog lists only the lead.
    // Require a full artist-name boundary; never match substrings (e.g. "Karol" in "Karoline").
    return artists.some(name=>b===name||b.startsWith(name+' '))||
           catalog.some(name=>a===name||a.startsWith(name+' '));
}

async function lookupLive365Artwork(track,generation){
    if(!track.needsArtwork||!track.artist||!track.song)return;
    const key=normalizedMusicText(track.artist)+'|'+normalizedMusicText(track.song);
    const applyCover=cover=>{
        if(cover&&generation===stationGeneration&&current&&sameTrack(current,track))
            showCurrent({...current,cover});
    };
    if(live365ArtworkCache.has(key)){
        applyCover(live365ArtworkCache.get(key));
        return;
    }
    const findMatch=results=>(results||[]).find(item=>
        item.kind==='song'&&item.artworkUrl100&&
        musicTitleMatches(track.song,item.trackName)&&
        musicArtistMatches(track.artist,item.artistName)
    );
    try{
        const search=async term=>{
            const params=new URLSearchParams({
                term,media:'music',entity:'song',country:'US',limit:'35'
            });
            const response=await fetch('https://itunes.apple.com/search?'+params);
            if(!response.ok)throw new Error('Artwork search failed');
            return (await response.json()).results||[];
        };
        // Full credits first. If the catalog indexes the song under one artist,
        // search by title and validate both title and artist before accepting.
        let match=findMatch(await search(track.artist+' '+track.song));
        if(!match)match=findMatch(await search(track.song));
        const cover=match&&match.artworkUrl100?
            match.artworkUrl100.replace(/100x100(?:bb|-[0-9]+)?/, '600x600bb'):'';
        live365ArtworkCache.set(key,cover);
        if(live365ArtworkCache.size>300)
            live365ArtworkCache.delete(live365ArtworkCache.keys().next().value);
        applyCover(cover);
    }catch(e){}
}

function live365Track(data){
    const t=data['current-track'];
    const fallback=data['station-logo']||data.logo||'';
    if(!t||!t.title)return {song:data.name||STATIONS[stationId].source,artist:'',cover:fallback};
    const title=t.title.replace(/\s*#\d+\s*-?\s*$/,'').trim();
    const realArt=t.art&&!/blankart\.jpg|station_profile_default|default.*art|placeholder/i.test(t.art);
    return {id:[t.start,t.artist,t.title].join('|'),song:title||t.title,
        artist:t.artist||'',cover:realArt?t.art:fallback,needsArtwork:!realArt};
}

async function refreshLive365(generation=stationGeneration){
    const station=STATIONS[stationId];
    if(station.provider!=='live365')return;
    try{
        const response=await fetch('https://api.live365.com/v1/station/'+station.stream.split('/').pop(),{cache:'no-store'});
        if(!response.ok||generation!==stationGeneration)return;
        const data=await response.json();
        if(generation!==stationGeneration)return;
        const track=live365Track(data);
        if(!current||!sameTrack(current,track)){
            showCurrent(track);
            lookupLive365Artwork(track,generation);
        }
        hidePending();
    }catch(e){
        if(generation===stationGeneration&&!current)
            showCurrent({song:station.source,artist:''});
    }
}

function startLive365(generation=stationGeneration){
    clearInterval(live365Timer);
    live365Timer=null;
    if(STATIONS[stationId].provider!=='live365')return;
    refreshLive365(generation);
    live365Timer=setInterval(()=>refreshLive365(generation),15000);
}

function resetTrackDisplay(){
    current=null;
    pending=null;

    if(promotionTimer){
        clearTimeout(promotionTimer);
        promotionTimer=null;
    }

    loading.style.display='block';
    loading.textContent='Loading song information…';

    song.textContent='';
    artist.textContent='';
    artist.style.display='none';

    art.style.display='none';
    art.removeAttribute('src');

    hidePending();

    document.title='Rican Radio';
}

function updateStationButtons(){
    stationButtons.forEach(button=>{
        button.classList.toggle(
            'active',
            button.dataset.station===stationId
        );
    });
}

async function selectStation(id){
    if(!STATIONS[id]||id===stationId)return;

    const wasPlaying=playing;

    stationGeneration++;
    const generation=stationGeneration;

    clearTimeout(reconnectTimer);
    clearInterval(live365Timer);
    live365Timer=null;

    if(socket){
        const oldSocket=socket;
        socket=null;
        try{oldSocket.close();}catch(e){}
    }

    audio.pause();

    stationId=id;
    localStorage.setItem('ricanRadioStation',stationId);

    const station=STATIONS[stationId];

    source.textContent=station.source;
    updateStationButtons();
    resetTrackDisplay();
    syncnote.style.display=station.channel?'block':'none';
    if(station.provider==='live365'||station.provider==='external'||station.provider==='embedded')showCurrent({song:station.source,artist:''});

    if(station.stream){audio.src=station.stream;audio.load();}
    else{audio.removeAttribute('src');audio.load();}

    loadInitialMetadata(generation);
    connectMetadata(generation);
    startLive365(generation);

    if(wasPlaying){
        status.textContent='Switching station…';

        try{
            await audio.play();
        }catch(e){
            playing=false;
            play.textContent='▶ Play';
            status.textContent='Tap Play to start '+station.label;
        }
    }else{
        status.textContent='Ready';
    }
}

stationButtons.forEach(button=>{
    button.addEventListener('click',()=>{
        selectStation(button.dataset.station);
    });
});

function initializeStation(){
    const station=STATIONS[stationId];

    source.textContent=station.source;
    if(station.stream)audio.src=station.stream;

    updateStationButtons();
    if(station.provider==='live365'||station.provider==='external'||station.provider==='embedded'){
        syncnote.style.display='none';
        showCurrent({song:station.source,artist:''});
    }
    loadInitialMetadata();
    connectMetadata();
    startLive365();
}

document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){
        loadInitialMetadata();
        connectMetadata();
        if(STATIONS[stationId].provider==='live365')refreshLive365();
    }
});

initializeStation();

if('serviceWorker' in navigator)
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>

</body>
</html>
